<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient ABHA Login - ABDM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen p-4">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg border border-slate-200">
        
        <!-- Header Branding & Navigation -->
        <div class="flex justify-between items-center mb-6 border-b pb-4">
            <a href="/home" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg border border-slate-300 transition">
                🏠 Back to Home
            </a>
            <span class="text-xs font-bold text-indigo-700 bg-indigo-50 px-2.5 py-1 rounded-full">Patient Portal</span>
        </div>

        <div class="text-center mb-6">
            <div class="inline-block bg-indigo-50 p-3 rounded-full mb-2">
                <svg class="w-8 h-8 text-indigo-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800">ABHA Patient Login</h1>
            <p class="text-xs text-slate-500">Access health records via OTP verification</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl text-center font-medium">
            ⚠️ {{ error }}
        </div>
        {% endif %}

        {% if message %}
        <div class="mb-4 p-3 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-xl text-center font-medium">
            ✅ {{ message }}
        </div>
        {% endif %}

        {% if not otp_sent %}
        <!-- Step 1: Send OTP -->
        <form action="/login" method="POST" class="space-y-4">
            <input type="hidden" name="action" value="send_otp">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">ABHA Address or 10-Digit Mobile</label>
                <input type="text" name="abha_input" placeholder="e.g. 8926935233 or 8926935233@abdm" required class="w-full text-sm p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition text-sm shadow-md">
                Get Verification OTP
            </button>
        </form>
        {% else %}
        <!-- Step 2: Verify OTP -->
        <form action="/login" method="POST" class="space-y-4">
            <input type="hidden" name="action" value="verify_otp">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Enter OTP Sent to {{ abha_input }}</label>
                <input type="text" name="otp" placeholder="Enter 123456" required class="w-full text-sm p-3 border rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none text-center font-mono text-lg tracking-widest">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition text-sm shadow-md">
                Verify OTP & Login
            </button>
        </form>
        {% endif %}

        <div class="text-center pt-4 border-t mt-6 flex justify-between items-center text-xs text-slate-500">
            <a href="/abha-creation" class="text-indigo-600 hover:underline font-semibold">New user? Register ABHA</a>
            <a href="/home" class="text-slate-500 hover:underline">Return to Main Page</a>
        </div>

    </div>

</body>
</html>
