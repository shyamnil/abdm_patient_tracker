<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital & Facility Login - ABDM</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center h-screen">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-lg border border-slate-200">
        <div class="text-center mb-6">
            <div class="inline-block bg-emerald-50 p-3 rounded-full mb-2">
                <svg class="w-8 h-8 text-emerald-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h4m-4 0V11m0 0h4m-4 0H9"></path>
                </svg>
            </div>
            <h1 class="text-xl font-bold text-slate-800">Hospital & Facility Portal</h1>
            <p class="text-xs text-slate-500">Health Facility Registry (HFR) Access</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 text-xs rounded-xl text-center font-medium">
            {{ error }}
        </div>
        {% endif %}

        <form action="/hospital-login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Health Facility ID (HFR ID)</label>
                <input type="text" name="hfr_id" placeholder="e.g. IN3310000001" required class="w-full text-sm p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>
            
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input type="password" name="password" placeholder="••••••••" required class="w-full text-sm p-3 border rounded-xl focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-3 rounded-xl transition text-sm shadow-md">
                Access Clinical Dashboard
            </button>
            
            <div class="text-center pt-2">
                <a href="/home" class="text-xs text-slate-500 hover:underline">← Back to ABDM Homepage</a>
            </div>
        </form>
    </div>

</body>
</html>
