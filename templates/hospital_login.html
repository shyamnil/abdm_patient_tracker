<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hospital Portal - ABDM Digital Health</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        html, body { overflow-x: hidden; width: 100%; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between antialiased relative overflow-hidden">

    <!-- Background Ambient Accents -->
    <div class="absolute -top-32 -right-32 w-96 h-96 bg-emerald-600/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -left-32 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <!-- ABDM Top Header Banner -->
    <div class="bg-slate-950/80 backdrop-blur-md text-slate-400 text-xs py-2 px-4 border-b border-slate-800/80">
        <div class="max-w-7xl mx-auto flex justify-between items-center text-[10px] sm:text-xs">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>Ayushman Bharat Digital Mission (ABDM)</span>
            </div>
            <span class="bg-emerald-950 text-emerald-400 font-extrabold px-2 py-0.5 rounded border border-emerald-800/60 text-[9px] sm:text-[10px]">
                HIP Portal
            </span>
        </div>
    </div>

    <!-- Central Login Box -->
    <main class="flex-grow flex items-center justify-center p-4 sm:p-6 z-10 w-full">
        <div class="w-full max-w-md">
            
            <!-- Card Shell -->
            <div class="bg-slate-950/80 backdrop-blur-xl border border-slate-800 shadow-2xl rounded-3xl p-6 sm:p-8 space-y-6">
                
                <!-- Facility Branding -->
                <div class="text-center space-y-2">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 text-2xl font-bold mb-1 shadow-inner">
                        🏥
                    </div>
                    <h1 class="text-xl sm:text-2xl font-black tracking-tight text-white">Health Facility Portal</h1>
                    <p class="text-xs text-slate-400 font-medium">Log in with your Health Facility Registry (HFR) credentials.</p>
                </div>

                <!-- Error Alert Box -->
                {% if error %}
                <div class="bg-red-500/10 border border-red-500/30 text-red-400 p-3.5 rounded-2xl text-xs font-semibold flex items-center gap-2.5">
                    <span class="text-base">⚠️</span>
                    <p class="leading-tight">{{ error }}</p>
                </div>
                {% endif %}

                <!-- Hospital Login Form -->
                <form action="/hospital-login" method="POST" class="space-y-4">
                    
                    <!-- HFR ID Field -->
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Health Facility ID (HFR ID)</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none text-sm">🆔</span>
                            <input 
                                type="text" 
                                name="hfr_id" 
                                placeholder="e.g. IN3310000001" 
                                required 
                                autocomplete="username"
                                class="w-full text-xs font-semibold p-3 pl-10 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-600 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                            >
                        </div>
                    </div>

                    <!-- Password Field with Toggle -->
                    <div class="space-y-1.5">
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-400">Facility Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500 pointer-events-none text-sm">🔒</span>
                            <input 
                                type="password" 
                                id="hospitalPassword"
                                name="password" 
                                placeholder="••••••••••••" 
                                required 
                                autocomplete="current-password"
                                class="w-full text-xs font-semibold p-3 pl-10 pr-10 bg-slate-900 border border-slate-800 rounded-xl text-white placeholder-slate-600 outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
                            >
                            <button 
                                type="button" 
                                onclick="togglePasswordVisibility()" 
                                class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 text-xs transition"
                            >
                                <span id="toggleIcon">👁️</span>
                            </button>
                        </div>
                    </div>

                    <!-- Submission Action -->
                    <button 
                        type="submit" 
                        class="w-full bg-indigo-700 hover:bg-indigo-600 text-white font-extrabold text-xs py-3.5 rounded-xl transition-all shadow-lg shadow-indigo-700/30 flex items-center justify-center gap-2 active:scale-[0.98]"
                    >
                        <span>Open Facility Clinical Queue</span>
                        <span>→</span>
                    </button>
                </form>

                <!-- Navigation Controls -->
                <div class="pt-2 border-t border-slate-800/80 flex justify-between items-center text-xs">
                    <a href="/home" class="text-slate-400 hover:text-indigo-400 font-semibold transition">
                        ← Portal Home
                    </a>
                    <a href="/login" class="text-indigo-400 hover:text-indigo-300 font-semibold transition">
                        Patient Login →
                    </a>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-4 text-center text-[10px] sm:text-xs text-slate-500 border-t border-slate-900 bg-slate-950/90 z-10">
        <p>© 2026 National Health Authority - Ayushman Bharat Digital Mission (ABDM)</p>
    </footer>

    <!-- Password Visibility Script -->
    <script>
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('hospitalPassword');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.innerText = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.innerText = '👁️';
            }
        }
    </script>

</body>
</html>
